name: CI

on:
  push:
    branches: [master, development]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Runs on an in-memory Postgres, so it needs no service container.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  postgres:
    name: Migrations and SQL on a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: percel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/percel_ci
      DB_SSL: 'false'
      # The seed gives the trend queries a real curve to aggregate.
      SEED_DUMMY_DATA: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every migration, from an empty database — the only place that proves
      # the whole chain still applies in order.
      - name: Apply migrations
        run: npm run migration:run

      # The in-memory database cannot run the dashboard's window functions.
      - name: Trend queries
        run: npm run test:live

      - name: Revert the last migration
        run: npm run migration:revert
